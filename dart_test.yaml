# Week 11 Day 1: tests tagged `live` call the real API, so a normal
# `flutter test` (and CI) skips them. Run them against a fresh database:
#   flutter test --run-skipped --tags live --dart-define=SEED_PASSWORD=...
tags:
  live:
    skip: "Needs the API running: flutter test --run-skipped --tags live"
  # Week 12 Day 1: alchemist tags every golden test. Run only them with
  # flutter test --tags golden, or leave them out with --exclude-tags golden.
  golden:
