name: matric_compass
description: "Matric Compass: the learner and counsellor app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Week 10 Day 1: exact versions, at least two weeks old, no ^.
dependencies:
  dio: 5.11.1
  drift: 2.35.3
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  freezed_annotation: 3.1.0
  go_router: 18.1.1
  intl: 0.20.3
  json_annotation: 4.12.0
  retrofit: 4.10.0
  riverpod_annotation: 4.0.7
  shared_preferences: 2.5.6

dev_dependencies:
  # Week 12 Day 1: golden tests, light and dark (CI goldens draw text as
  # blocks, so Windows, macOS and Linux render the same pixels).
  alchemist: 0.14.1
  build_runner: 2.16.2
  drift_dev: 2.35.2
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  go_router_builder: 4.5.2
  # Week 12 Day 1: the whole app on an emulator, from integration_test/.
  integration_test:
    sdk: flutter
  json_serializable: 6.15.2
  # Week 12 Day 1: mocks with no code generation.
  mocktail: 1.0.5
  retrofit_generator: 10.3.3
  riverpod_generator: 4.0.9
  riverpod_lint: 3.1.9
  swagger_parser: 1.45.1
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true

# Week 11 Day 2: flutter_secure_storage pulls these in for iOS and macOS.
# pub picks their newest releases, which were under two weeks old on
# 17 November 2026 (objective_c 9.6.4 on 11 Nov, code_assets 2.2.0 on
# 6 Nov). Held back to the newest that were two weeks old; remove these
# lines after 25 November 2026.
dependency_overrides:
  # Week 11 Day 3: more of the same, checked against pubspec.lock on
  # 18 November 2026. go_router's material_ui 1.11.0 (9 Nov) had slipped in
  # on Day 2; drift and shared_preferences pull in native_toolchain_c,
  # shared_preferences_android, shared_preferences_foundation and sqlite3.
  # Each is held at the newest release that was two weeks old. Remove each
  # line once the version pub would pick is two weeks old (after
  # 25 November 2026).
  code_assets: 2.1.0
  material_ui: 1.10.0
  native_toolchain_c: 0.19.5
  objective_c: 9.6.2
  shared_preferences_android: 2.5.4
  shared_preferences_foundation: 2.6.1
  sqlite3: 3.8.0
