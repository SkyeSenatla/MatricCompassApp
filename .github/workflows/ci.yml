# Week 10 Day 1: every push to main and every pull request is checked on a
# clean Linux machine, with the same Flutter as every laptop in the class.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Format, generate, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      # Week 11 Day 1: the drift check. Generate the client again from the
      # committed contract copy; any difference from the committed client
      # means someone changed one without the other. Deleting first matters:
      # the generator doesn't remove files it no longer writes.
      - name: Client matches the contract
        run: |
          rm -rf lib/core/api/generated
          dart run swagger_parser
          dart format lib/core/api/generated
          # Changed files, then files the committed client doesn't have.
          git diff --exit-code -- lib/core/api/generated
          test -z "$(git ls-files --others --exclude-standard lib/core/api/generated)"

      # Generated files aren't committed, so they're made before the
      # analyser runs: it can't check code that refers to them otherwise.
      - name: Generate code
        run: dart run build_runner build

      # dart analyze, not flutter analyze: only dart analyze runs analyser
      # plugins such as riverpod_lint. --fatal-infos: very_good_analysis
      # reports most rules as infos, and a finding nobody has to fix is a
      # finding nobody reads.
      - name: Analyze
        run: dart analyze --fatal-infos

      # Week 12 Day 1: the same tests, now recording which lines ran.
      - name: Test
        run: flutter test --coverage

      # Week 12 Day 1: a floor, not a goal. It stops the suite shrinking
      # quietly: delete the test that was in the way, and CI says no. Set a
      # little under today's number, and raised as tests are added.
      - name: Coverage floor
        run: dart run tool/check_coverage.dart 80

  # Week 12 Day 1: the one journey, on a real Android emulator. Slow (a few
  # minutes to boot), so it runs only after the fast checks pass.
  journey:
    name: Learner journey on an emulator
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # From android-emulator-runner's README: lets the emulator use the
      # runner's hardware acceleration, without which it crawls.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and generate
        run: |
          flutter pub get
          dart run build_runner build

      - name: Run the journey
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          script: flutter test integration_test --flavor dev --dart-define-from-file=config/dev.json
